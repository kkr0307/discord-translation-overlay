name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          python build.py

      - name: Build Installer with Inno Setup
        run: |
          iscc installer_setup.iss

      - name: Generate SHA-256 Hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/DiscordTranslator_Installer.exe -Algorithm SHA256).Hash.ToLower()
          echo "SHA256: $hash"
          echo "HASH=$hash" >> $env:GITHUB_ENV
          Set-Content -Path dist/DiscordTranslator_Installer.exe.sha256 -Value "$hash *DiscordTranslator_Installer.exe"

      - name: Upload Artifact (Workflow Run)
        uses: actions/upload-artifact@v4
        with:
          name: DiscordTranslator-Installer
          path: |
            dist/DiscordTranslator_Installer.exe
            dist/DiscordTranslator_Installer.exe.sha256

      - name: Create GitHub Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DiscordTranslator_Installer.exe
            dist/DiscordTranslator_Installer.exe.sha256
          body: |
            ### File Verification
            To ensure the integrity of the downloaded installer, you can compare its SHA-256 checksum:
            
            | File | SHA-256 Hash |
            | --- | --- |
            | `DiscordTranslator_Installer.exe` | `${{ env.HASH }}` |
            
            #### How to verify in Windows PowerShell:
            ```powershell
            Get-FileHash .\DiscordTranslator_Installer.exe -Algorithm SHA256
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
